services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: verro-site
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - monsite-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: monsite-api
    working_dir: /app
    ports:
      - '${API_PORT:-5000}:5000'
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    networks:
      - monsite-network
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  monsite-network:
    driver: bridge

